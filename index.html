<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>战争与和平 · 人物关系图谱与拆书笔记</title>
<meta name="description" content="《战争与和平》（草婴译本）拆书：卷部章 × 事件 × 时间 × 人物关系 × 地点。拖动年代滑块，看关系如何随时间重连。">
<link rel="stylesheet" href="assets/vendor/leaflet.css?v=20">
<link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header id="topbar">
  <div class="brand">
    <div class="emblem">战争<br>和平</div>
    <div class="brand-text">
      <h1>人物关系图谱与拆书笔记</h1>
      <div class="sub">草婴 译本 · 4 卷 15 部 + 尾声 2 部 · 361 章</div>
    </div>
  </div>
  <div class="controls">
    <input id="searchBox" type="search" placeholder="搜索人物 / 章节 / 事件…（按 / 聚焦）">
    <button class="btn-ghost" id="btnChars">人物志</button>
    <button class="btn-ghost" id="btnThemes">主题线</button>
    <button class="btn-ghost" id="btnGuide">引导</button>
  </div>
</header>

<!-- ============ 视图切换 ============ -->
<nav id="viewTabs">
  <button class="tab active" data-view="relations">关系</button>
  <button class="tab" data-view="family">家族</button>
  <button class="tab" data-view="map">地图</button>
  <button class="tab" data-view="read">阅读</button>
</nav>

<!-- ============ 年代滑块 ============ -->
<div id="timebar">
  <span class="tl-label">1805</span>
  <input type="range" id="yearSlider" min="1805" max="1820" value="1805" step="1">
  <span class="tl-label">1820</span>
  <span id="yearDisplay">1805 年</span>
  <button id="playBtn">▶ 播放</button>
  <span class="hint">拖动看关系如何随时间重连</span>
</div>

<!-- ============ 主区 ============ -->
<main id="main">

  <!-- 关系视图（默认） -->
  <section class="view active" id="viewRelations">
    <div id="graphPane">
      <div id="graph"></div>
      <div id="graphLegend">
        <div class="lg-title">关系类型</div>
        <div class="lg-row"><span class="lg-swatch" style="background:#c9a227"></span>婚 / 订婚</div>
        <div class="lg-row"><span class="lg-swatch" style="background:#e0a05c"></span>恋爱</div>
        <div class="lg-row"><span class="lg-swatch" style="background:#c8d2dc"></span>血缘</div>
        <div class="lg-row"><span class="lg-swatch" style="background:#8c4a66"></span>敌对</div>
        <div class="lg-row"><span class="lg-swatch" style="background:#6f8f7a"></span>挚友</div>
        <div class="lg-row"><span class="lg-swatch" style="background:#4a6a4a"></span>军中共事</div>
        <div class="lg-row"><span class="lg-swatch" style="background:#5d6b7c"></span>社交</div>
      </div>
    </div>
    <aside id="relPane"></aside>
  </section>

  <!-- 家族视图 -->
  <section class="view" id="viewFamily"></section>

  <!-- 地图视图 -->
  <section class="view" id="viewMap">
    <div id="map"></div>
    <aside id="mapPane"></aside>
  </section>

  <!-- 阅读视图 -->
  <section class="view" id="viewRead">
    <div id="readToolbar">
      <label>卷部</label>
      <select id="filterBook"></select>
      <label>人物</label>
      <select id="filterChar"></select>
      <label>类型</label>
      <select id="filterTag">
        <option value="">全部</option>
        <option value="peace">和平</option>
        <option value="war">战争</option>
        <option value="essay">议论</option>
        <option value="transition">过场</option>
      </select>
      <input id="filterQ" type="search" placeholder="关键词…" style="width:150px">
      <span id="chapterCount"></span>
    </div>
    <div id="readBody">
      <div id="chapterList"></div>
    </div>
  </section>

</main>

<!-- ============ 弹层 ============ -->
<div id="overlay"><div class="modal" id="modalBody"></div></div>

<!-- ============ 引导 ============ -->
<div id="guide"><div class="guide-card" id="guideBody"></div></div>

<!-- ============ 数据 ============ -->
<script src="assets/vendor/leaflet.js?v=20"></script>
<script src="assets/vendor/echarts.min.js?v=20"></script>
<script src="assets/europe.js?v=20"></script>
<script src="data/structure.js?v=20"></script>
<script src="data/places.js?v=20"></script>
<script src="data/characters.js?v=20"></script>
<script src="data/families.js?v=20"></script>
<script src="data/relations.js?v=20"></script>
<script src="data/themes.js?v=20"></script>
<script src="data/arcs.js?v=20"></script>
<script src="data/battles.js?v=20"></script>
<script src="data/routes.js?v=20"></script>
<script src="data/glossary.js?v=20"></script>
<script src="data/names.js?v=20"></script>
<script src="data/chapters.js?v=20"></script>
<script src="data/events.js?v=20"></script>

<!-- ============ 逻辑 ============ -->
<script src="js/notes.js?v=20"></script>
<script src="js/relations.js?v=20"></script>
<script src="js/family.js?v=20"></script>
<script src="js/map.js?v=20"></script>
<script src="js/app.js?v=20"></script>
</body>
</html>
